services:
  postgres:
    image: postgres:18.4-alpine
    container_name: tasktracker-db
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: tasktracker
      POSTGRES_DB: tasktracker
      # POSTGRES_PASSWORD берётся из .env.docker (см. env_file выше).
    # Публикуем на хост только для удобства — подключиться локальным psql/GUI
    # клиентом. Само приложение ходит в Postgres по имени сервиса во внутренней
    # docker-сети (см. DATABASE_URL в .env.docker.example), этот порт ему не нужен.
    ports:
      - "5433:5432"
    volumes:
      # Именованный volume — Docker сам решает, где физически хранить данные;
      # portable между Linux/macOS/Windows, никаких абсолютных host-путей.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasktracker -d tasktracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: task-tracker:latest
    container_name: task-tracker
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Вложения задач и аватары — переживают пересборку/пересоздание контейнера.
      - ./data/attachments:/app/data/attachments

volumes:
  postgres_data:
