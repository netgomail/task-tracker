name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Каждый понедельник в 09:00 UTC
    - cron: "0 9 * * 1"

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # postcss и sharp вшиты внутрь пакета next (Image Optimization API) и
      # тянутся его собственным package.json — обновятся вместе с апстримом,
      # текущая 16.2.12 уже самая свежая стабильная. См. SECURITY.md.
      # Всё остальное high/critical — жёсткий стоп.
      - name: Run security audit (production deps only)
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("audit.json", "utf8"));
            const BASE_ACCEPTED = new Set(["postcss", "sharp"]);
            // Принято, если пакет сам в списке, либо его запись целиком
            // производная от принятых (via — только имена пакетов, без
            // собственной advisory-записи). Если у next появится СВОЯ CVE,
            // via будет содержать объект advisory — такое не пройдёт.
            function isAccepted(v) {
              if (BASE_ACCEPTED.has(v.name)) return true;
              if (Array.isArray(v.via) && v.via.length > 0 && v.via.every((x) => typeof x === "string")) {
                return v.via.every((name) => BASE_ACCEPTED.has(name));
              }
              return false;
            }
            const vulns = Object.values(data.vulnerabilities || {});
            const blocking = vulns.filter(
              (v) => (v.severity === "high" || v.severity === "critical") && !isAccepted(v),
            );
            if (blocking.length > 0) {
              console.error("Непринятые high/critical уязвимости:");
              for (const v of blocking) console.error(` - ${v.name} (${v.severity})`);
              process.exit(1);
            }
            const accepted = vulns.filter(
              (v) => (v.severity === "high" || v.severity === "critical") && isAccepted(v),
            );
            for (const v of accepted) {
              console.log(`Принятый риск (см. SECURITY.md): ${v.name} (${v.severity})`);
            }
            console.log("OK: новых high/critical уязвимостей не найдено.");
          '
